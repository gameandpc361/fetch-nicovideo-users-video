
name: Niconico Video Collector

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Niconico User ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn curl

      - name: Connect VPN Gate
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
        run: |
          set -e

          printf '%s' "$VPN_CONFIG" > /tmp/vpngate.ovpn

          printf 'vpn\nvpn\n' > /tmp/vpn-auth.txt
          chmod 600 /tmp/vpn-auth.txt

          sudo openvpn \
            --config /tmp/vpngate.ovpn \
            --auth-user-pass /tmp/vpn-auth.txt \
            --auth-nocache \
            --daemon \
            --writepid /tmp/openvpn.pid \
            --log /tmp/openvpn.log

          CONNECTED=0

          for i in $(seq 1 45); do
            if curl -4 -fsS --max-time 5 \
              https://ipinfo.io/country | grep -qx JP; then
              CONNECTED=1
              break
            fi
            sleep 2
          done

          if [ "$CONNECTED" -ne 1 ]; then
            sudo tail -n 60 /tmp/openvpn.log
            echo "::error::VPN connection failed"
            exit 1
          fi

          echo "VPN connected successfully."

      - name: Verify VPN
        run: |
          echo "Country:"
          curl -4 -fsS https://ipinfo.io/country

          echo "Public IP:"
          curl -4 -fsS https://api.ipify.org
          echo

      - name: Collect videos
        env:
          USER_ID: ${{ inputs.user_id || vars.NICONICO_USER_ID }}
        run: |
          if [ -z "$USER_ID" ]; then
            echo "::error::User ID is missing"
            exit 1
          fi

          python scripts/get_videos.py \
            --user-id "$USER_ID" \
            --output videos_"$USER_ID".txt

      - name: Verify output
        run: |
          test -s videos.txt || exit 1
          echo "Collected: $(wc -l < videos_${{ inputs.user_id }}.txt) videos"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: niconico-video-urls
          path: videos_${{ inputs.user_id }}.txt
          retention-days: 30
