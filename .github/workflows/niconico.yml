
name: Niconico User Video Collector

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Niconico User ID"
        required: true
        type: string

  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect videos
        env:
          USER_ID: ${{ inputs.user_id || vars.NICONICO_USER_ID }}
        run: |
          if [ -z "$USER_ID" ]; then
            echo "User ID is not configured."
            exit 1
          fi

          python scripts/get_videos.py \
            --user-id "$USER_ID" \
            --page-size 100 \
            --output videos.txt

      - name: Upload video URLs
        uses: actions/upload-artifact@v4
        with:
          name: niconico-video-urls
          path: videos.txt
          if-no-files-found: error
          retention-days: 30
